name: Bug Report
description: File a bug report for Hastivo
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much context as possible.
  - type: dropdown
    id: service
    attributes:
      label: Affected Service
      description: Which service is affected by this issue?
      options:
        - Frontend (React / Three.js)
        - Backend Gateway (Node.js)
        - AI Service (Python FastAPI)
        - Computer Vision Service (MediaPipe / FastAPI)
        - Real-Time Microservice (WebSockets)
        - Testing / CI/CD
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen according to the system specification.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Information
      description: Node.js version, Python version, OS, Browser, etc.
      placeholder: |
        - OS: Windows 11 / Ubuntu 22.04 / macOS
        - Browser: Chrome 124
        - Node Version: v20.x
        - Python Version: 3.11.x
    validations:
      required: false

