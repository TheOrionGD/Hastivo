name: Signora CI/CD

on:
  push:
    branches: [ "main", "theoriongd" ]
  pull_request:
    branches: [ "main", "theoriongd" ]

permissions:
  contents: read

jobs:
  lint-and-build-frontend:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Oxlint Check
        working-directory: frontend
        run: npm run lint

      - name: Build Frontend Application
        working-directory: frontend
        run: npm run build

  backend-and-integration-tests:
    name: Backend & Microservice Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            microservice/package-lock.json
            testing/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Install Microservice Dependencies
        working-directory: microservice
        run: npm ci

      - name: Install Testing Dependencies
        working-directory: testing
        run: npm ci

      - name: Run Backend Test Suite
        working-directory: testing
        run: node test_backend_suite.js

      - name: Run Microservice Test
        working-directory: microservice
        run: npm test

  python-services-tests:
    name: AI & Vision Python Engine Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install AI Service Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r ai-service/requirements.txt

      - name: Run AI Service Tests
        working-directory: ai-service
        run: pytest

      - name: Install Computer Vision Requirements
        run: pip install -r computer-vision/requirements.txt

      - name: Run Vision Service Tests
        working-directory: computer-vision
        run: pytest

