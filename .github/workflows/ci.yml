name: Hastivo CI/CD

on:
  push:
    branches: [ "main", "theoriongd" ]
  pull_request:
    branches: [ "main", "theoriongd" ]

permissions:
  contents: read

jobs:
  lint-and-build-client:
    name: Client Lint & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        working-directory: client
        run: npm ci

      - name: Build Client Application
        working-directory: client
        run: npm run build

  build-showcase-app:
    name: Showcase App Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install App Dependencies
        working-directory: app
        run: npm ci

      - name: Build Showcase App
        working-directory: app
        run: npm run build

  backend-and-integration-tests:
    name: Backend & Microservice Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            services/package-lock.json
            tests/package-lock.json

      - name: Install Server Dependencies
        working-directory: server
        run: npm ci

      - name: Install Services Dependencies
        working-directory: services
        run: npm ci

      - name: Install Testing Dependencies
        working-directory: tests
        run: npm ci

      - name: Run Backend Test Suite
        working-directory: tests
        run: node test_backend_suite.js

      - name: Run Microservice Test
        working-directory: services
        run: npm test

  python-services-tests:
    name: AI & Vision Python Engine Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install AI Service Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r models/requirements.txt

      - name: Run AI Service Tests
        working-directory: models
        run: python -m pytest tests/

      - name: Install Computer Vision Requirements
        run: pip install -r images/requirements.txt

      - name: Run Vision Service Tests
        working-directory: images
        run: python -m pytest tests/

